name: Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing Actions secret: ${v} — cannot sign release. Set the 4 repo secrets; no debug fallback exists."
              missing=1
            fi
          done
          exit ${missing}

      - name: Decode keystore to temp file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luxchart-release.jks"
          test -s "$RUNNER_TEMP/luxchart-release.jks"

      - name: Sanity-check keystore and alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/luxchart-release.jks" \
            -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" >/dev/null
          keytool -list -keystore "$RUNNER_TEMP/luxchart-release.jks" \
            -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/luxchart-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature (apksigner)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuxChart-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Delete temp keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/luxchart-release.jks"
